<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Tanzu App Versions</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background-color: #f4f6f8; margin: 40px; text-align: center; }
        .container { background: white; border: 1px solid #ddd; padding: 30px; border-radius: 8px; display: inline-block; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        h1 { color: #6db33f; } /* Spring Green */
        .version-row { font-size: 1.2em; margin: 15px 0; }
        .label { font-weight: bold; color: #333; }
        .value { color: #0056b3; }
    </style>
</head>
<body>
    <div class="container">
        <h1>System Information</h1>
        <div class="version-row">
            <span class="label">Java Version:</span>
            <span class="value" th:text="${javaVersion}"></span>
        </div>
        <div class="version-row">
            <span class="label">Spring Boot Version:</span>
            <span class="value" th:text="${springBootVersion}"></span>
        </div>
        <div class="version-row">
            <span class="label">Spring Framework Version:</span>
            <span class="value" th:text="${springFrameworkVersion}"></span>
        </div>
    </div>
</body>
</html>
